# Liquid Home – Haupt-Theme (hell und dunkel)
Liquid Home:
  primary-font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
  ha-font-family-body: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
  ha-card-border-radius: 24px
  ha-card-border-width: 1px
  ha-card-border-style: solid
  ha-card-border-color: var(--liquid-border)
  ha-card-background: var(--liquid-card-background)
  ha-card-backdrop-filter: var(--liquid-card-filter)
  ha-card-box-shadow: var(--liquid-shadow)
  card-background-color: var(--liquid-card-fallback)
  mush-chip-border-radius: 16px
  mush-chip-height: 36px
  mush-chip-spacing: 8px
  mush-chip-background: var(--liquid-chip-background)
  mush-card-primary-font-weight: 600
  mush-card-secondary-font-weight: 400
  primary-color: '#0A84FF'
  accent-color: '#0A84FF'
  state-light-active-color: '#FFD60A'
  ha-dialog-surface-border-radius: 28px
  ha-dialog-surface-background: var(--liquid-dialog-background)
  ha-dialog-scrim-backdrop-filter: var(--liquid-dialog-scrim)
  card-mod-card: |-
    ha-card {
      background: var(--liquid-card-background);
      border: 1px solid var(--liquid-border);
      box-shadow: var(--liquid-shadow);
      backdrop-filter: var(--liquid-card-filter);
      -webkit-backdrop-filter: var(--liquid-card-filter);
    }
  card-mod-theme: Liquid Home
  modes:
    light:
      liquid-card-background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 48%, rgba(235,242,255,0.07) 100%), rgba(248,250,255,0.80)
      liquid-card-fallback: rgba(248,250,255,0.82)
      liquid-card-filter: blur(12px) saturate(115%)
      liquid-chip-background: rgba(248,250,255,0.84)
      liquid-border: rgba(255,255,255,0.38)
      liquid-shadow: 0 4px 12px rgba(35,45,70,0.08), inset 0 1px 0 rgba(255,255,255,0.48)
      liquid-dialog-background: rgba(248,250,255,0.96)
      liquid-dialog-scrim: blur(12px) brightness(82%)
      lovelace-background: '#EEF2F7'
      background-image: '#EEF2F7'
      primary-background-color: '#EEF2F7'
      app-header-background-color: rgba(238,242,247,0.82)
      app-theme-color: '#EEF2F7'
      app-header-text-color: '#1C1C1E'
      app-header-border-bottom: 1px solid rgba(255,255,255,0.38)
      primary-text-color: '#1C1C1E'
      secondary-text-color: '#6E6E73'
      divider-color: rgba(60,60,67,0.12)
    dark:
      liquid-card-background: linear-gradient(135deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.015) 46%, rgba(5,10,24,0.10) 100%), rgba(16,21,35,0.82)
      liquid-card-fallback: rgba(12,17,32,0.82)
      liquid-card-filter: blur(14px) saturate(115%)
      liquid-chip-background: rgba(18,24,43,0.84)
      liquid-border: rgba(255,255,255,0.10)
      liquid-shadow: 0 5px 14px rgba(0,0,12,0.20), inset 0 1px 0 rgba(255,255,255,0.10)
      liquid-dialog-background: rgba(17,22,39,0.96)
      liquid-dialog-scrim: blur(12px) brightness(62%)
      lovelace-background: '#090D18'
      background-image: '#090D18'
      primary-background-color: '#090D18'
      app-header-background-color: rgba(9,13,24,0.80)
      app-theme-color: '#090D18'
      app-header-text-color: '#F5F7FF'
      app-header-border-bottom: 1px solid rgba(255,255,255,0.08)
      primary-text-color: '#F5F7FF'
      secondary-text-color: '#B8C0D4'
      divider-color: rgba(255,255,255,0.10)
