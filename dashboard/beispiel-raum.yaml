# Liquid Glas – Beispiel-Raum (Küche)
# Entitäten durch eure ersetzen. Braucht Bubble Card, card-mod und die Module aus www/bubble/.
views:
- title: Küche (Beispiel)
  path: kueche
  icon: mdi:stove
  type: sections
  max_columns: 1
  subview: true
  sections:
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: ' '
      tap_action:
        action: none
      button_action:
        tap_action:
          action: none
      styles: |2-

        ha-card { background: none !important; border: none !important; box-shadow: none !important;
          backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .bubble-button-card-container, .bubble-container { background: none !important; border: none !important;
          box-shadow: none !important; backdrop-filter: none !important; height: 24px !important; }
        .bubble-button-background, .bubble-icon-container { display: none !important; }
        .bubble-button-card { padding: 4px 4px 0 !important; align-items: flex-start !important; }
        .bubble-name-container { margin: 0 !important; width: 100% !important; }
        .bubble-name-container { display: block !important; }
        .bubble-name { display: block !important; white-space: normal !important; overflow: visible !important; color: #f4efe6 !important;
          text-shadow: 0 1px 8px rgba(0,0,0,0.38); line-height: 1.3; }
        .bubble-name .g, .bubble-name .w, .bubble-name .i, .bubble-name .t { display: block; }
        .bubble-name .g { font-size: 32px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.15; }
        .bubble-name .w { height: 10px; }
        .bubble-name .i { font-size: 14px; font-weight: 400; opacity: .85; white-space: pre-wrap; }
        .bubble-name .t { font-size: 13px; font-weight: 400; opacity: .6; margin-top: 3px; }

        .bubble-name .g { display: none !important; }
        .bubble-name .s { display: block; font-size: 14px; opacity: .85; margin: 0; }
        .bubble-button-card { padding: 0 4px !important; }
        ${(() => { const ids = [...new Set([...((hass.states['light.kueche_licht'] || {attributes: {}}).attributes.entity_id || []), ...["light.kueche_kochfeld", "light.kueche_spots", "light.kueche_ambient", "light.kueche_insel", "light.kueche_nische", "light.kueche_schrank_led"]])]; const n = ids.filter(e => hass.states[e] && hass.states[e].state === 'on').length; const t = parseFloat((hass.states['sensor.kueche_temperatur'] || {}).state), hu = parseFloat(null); const parts = [n ? n + (n === 1 ? ' Licht an' : ' Lichter an') : 'Alles aus']; if (!isNaN(t)) parts.push(t.toFixed(1).replace('.', ',') + '°'); if (!isNaN(hu)) parts.push(Math.round(hu) + ' %'); const el = card.querySelector('.bubble-name'); if (el) el.innerHTML = '<div class="g">Küche</div><div class="s">' + parts.join(' · ') + '</div>'; return ''; })()}
